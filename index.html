
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CogniLift | 深度理解訓練</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        // 環境變數墊片，防止 process 未定義錯誤
        window.process = { env: { API_KEY: "" } };
        
        // 捕捉全域錯誤以協助診斷白屏
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const root = document.getElementById('root');
            if (root && root.innerHTML === "") {
                root.innerHTML = `<div style="padding:20px; color:red; font-family:sans-serif;">
                    <h3>應用程式載入錯誤</h3>
                    <p>${msg}</p>
                    <small>這通常是因為瀏覽器無法解析 .tsx 檔案，或 importmap 載入失敗。</small>
                </div>`;
            }
            return false;
        };
    </script>

    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: #f8fafc;
            margin: 0; 
            color: #1e293b;
        }
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div class="loading-screen text-slate-400">
            <div class="animate-spin w-8 h-8 border-2 border-indigo-600 border-t-transparent rounded-full mb-4"></div>
            <p>正在初始化 CogniLift 訓練系統...</p>
        </div>
    </div>
</body>
</html>
