
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CogniLift | 深度理解訓練</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        // 初始化全域變數，確保 AI SDK 不會報錯
        window.process = { env: { API_KEY: "" } };
        console.log("CogniLift: 預載入腳本已啟動");

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `<div style="padding:40px; color:#ef4444; font-family:sans-serif; text-align:center;">
                    <h3 style="font-size:20px; font-weight:bold;">啟動系統時發生錯誤</h3>
                    <p style="color:#64748b; margin:10px 0;">${msg}</p>
                    <button onclick="window.location.reload()" style="background:#4f46e5; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">重新嘗試啟動</button>
                </div>`;
            }
            return false;
        };
    </script>

    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: #f8fafc;
            margin: 0; 
            color: #1e293b;
        }
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #6366f1;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div class="loading-screen text-slate-400">
            <div class="spinner"></div>
            <p id="loading-text">正在連結 CogniLift 神經網路...</p>
        </div>
    </div>
    
    <!-- 使用 type="module" 並確保路徑正確 -->
    <script type="module">
        import "./index.tsx";
        console.log("CogniLift: index.tsx 模組已嘗試載入");
    </script>
</body>
</html>
