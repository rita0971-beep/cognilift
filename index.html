
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CogniLift | 深度理解訓練</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        // 初始化全域變數
        window.process = { env: { API_KEY: "" } };
        
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error("CogniLift 啟動錯誤:", msg);
            const root = document.getElementById('root');
            if (root && root.querySelector('.spinner')) {
                root.innerHTML = `
                    <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
                        <h2 style="color: #ef4444;">系統初始化失敗</h2>
                        <p style="color: #64748b;">${msg}</p>
                        <button onclick="window.location.reload()" style="margin-top: 1rem; background: #4f46e5; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer;">重試</button>
                    </div>
                `;
            }
        };
    </script>

    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: #f8fafc;
            margin: 0; 
            color: #1e293b;
        }
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.5rem;
        }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root">
        <div class="loading-screen text-slate-400">
            <div class="spinner"></div>
            <p style="font-weight: 500; color: #64748b;">正在載入 CogniLift 核心...</p>
        </div>
    </div>
    <!-- 核心修正：必須明確引用入口點，否則瀏覽器不會執行 React 代碼 -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
